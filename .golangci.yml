# This file contains the configuration for golangci-lint
# See https://golangci-lint.run/usage/configuration/ for more information

run:
  timeout: 5m

# Simplified configuration focusing on basic linters
linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

# Exclude test files from errcheck
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  
  # Max issues per linter
  max-issues-per-linter: 0
  
  # Max same issues
  max-same-issues: 0

# Output configuration
output:
  formats:
    - colored-line-number
  print-issued-lines: true
  print-linter-name: true
