[package]
name = "herojobs_client"
version = "0.1.0"
edition = "2024"
description = "Rust client for HeroJobs Unix domain socket server"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1.7", features = ["v4", "serde"] }
