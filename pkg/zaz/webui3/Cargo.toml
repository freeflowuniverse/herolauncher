[package]
name = "webui3"
version = "0.1.0"
edition = "2021"

[dependencies]
maud = "0.25.0"
axum = { version = "0.7.2", features = ["multipart"] }
tower-http = { version = "0.5.0", features = ["fs", "trace"] }
tokio = { version = "1.34.0", features = ["full"] }
chrono = "0.4.31"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
