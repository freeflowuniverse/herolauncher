basePath: /api
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  api.ExecuteCommandRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
    required:
    - args
    - command
    type: object
  api.ExecuteCommandResponse:
    properties:
      job_id:
        type: string
    required:
    - job_id
    type: object
  api.JetTemplateRequest:
    properties:
      template:
        type: string
    required:
    - template
    type: object
  api.JetTemplateResponse:
    properties:
      error:
        type: string
      message:
        type: string
      valid:
        type: boolean
    required:
    - error
    - message
    - valid
    type: object
  api.JobResponse:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      end_time:
        type: string
      error:
        type: string
      id:
        type: string
      output:
        type: string
      start_time:
        type: string
      status:
        type: string
    required:
    - args
    - command
    - end_time
    - error
    - id
    - output
    - start_time
    - status
    type: object
  api.ProcessDisplayInfo:
    properties:
      cpu:
        type: string
      id:
        type: string
      memory:
        type: string
      name:
        type: string
      start_time:
        type: string
      status:
        type: string
      uptime:
        type: string
    required:
    - cpu
    - id
    - memory
    - name
    - start_time
    - status
    - uptime
    type: object
host: localhost:9001
info:
  contact:
    email: support@freeflowuniverse.org
    name: API Support
  description: API for HeroLauncher - a modular service manager
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: HeroLauncher API
  version: "1.0"
paths:
  /admin/services/:
    get:
      description: Get the services management page
      produces:
      - text/html
      responses:
        "200":
          description: HTML content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get services page
      tags:
      - admin
  /admin/services/data:
    get:
      description: Get services data for AJAX updates
      produces:
      - text/html
      responses:
        "200":
          description: HTML content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get services data
      tags:
      - admin
  /admin/services/delete:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Delete a service by name
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a service
      tags:
      - services
  /admin/services/logs:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Get logs for a specific process
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      - description: Number of log lines to retrieve
        in: formData
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get process logs
      tags:
      - services
  /admin/services/restart:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Restart a running service by name
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Restart a service
      tags:
      - services
  /admin/services/running:
    get:
      consumes:
      - application/json
      description: Get a list of all currently running services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/api.ProcessDisplayInfo'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get running services
      tags:
      - services
  /admin/services/start:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Start a new service with the given name and command
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      - description: Command to run
        in: formData
        name: command
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a service
      tags:
      - services
  /admin/services/stop:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Stop a running service by name
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stop a service
      tags:
      - services
  /api/executor/execute:
    post:
      consumes:
      - application/json
      description: Execute a command and return a job ID
      parameters:
      - description: Command to execute
        in: body
        name: command
        required: true
        schema:
          $ref: '#/definitions/api.ExecuteCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ExecuteCommandResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Execute a command
      tags:
      - executor
  /api/executor/jobs:
    get:
      description: Get a list of all command execution jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.JobResponse'
            type: array
      summary: List all jobs
      tags:
      - executor
  /api/executor/jobs/{id}:
    get:
      description: Get details of a specific job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get job details
      tags:
      - executor
  /api/jet/validate:
    post:
      consumes:
      - application/json
      description: Validates a Jet template and returns detailed error information
        if invalid
      parameters:
      - description: Jet template to validate
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/api.JetTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JetTemplateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Validate a Jet template
      tags:
      - jet
  /api/services/delete:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Delete a service by name
      parameters:
      - description: Service name
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a service
      tags:
      - services
  /api/services/logs:
