basePath: /api
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  api.ExecuteCommandRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
    required:
    - args
    - command
    type: object
  api.ExecuteCommandResponse:
    properties:
      job_id:
        type: string
    required:
    - job_id
    type: object
  api.JetTemplateRequest:
    properties:
      template:
        type: string
    required:
    - template
    type: object
  api.JetTemplateResponse:
    properties:
      error:
        type: string
      message:
        type: string
      valid:
        type: boolean
    required:
    - error
    - message
    - valid
    type: object
  api.JobResponse:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      end_time:
        type: string
      error:
        type: string
      id:
        type: string
      output:
        type: string
      start_time:
        type: string
      status:
        type: string
    required:
    - args
    - command
    - end_time
    - error
    - id
    - output
    - start_time
    - status
    type: object
host: localhost:9001
info:
  contact:
    email: support@freeflowuniverse.org
    name: API Support
  description: API for HeroLauncher - a modular service manager
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: HeroLauncher API
  version: "1.0"
paths:
  /api/executor/execute:
    post:
      consumes:
      - application/json
      description: Execute a command and return a job ID
      parameters:
      - description: Command to execute
        in: body
        name: command
        required: true
        schema:
          $ref: '#/definitions/api.ExecuteCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ExecuteCommandResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Execute a command
      tags:
      - executor
  /api/executor/jobs:
    get:
      description: Get a list of all command execution jobs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.JobResponse'
            type: array
      summary: List all jobs
      tags:
      - executor
  /api/executor/jobs/{id}:
    get:
      description: Get details of a specific job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get job details
      tags:
      - executor
  /api/jet/validate:
    post:
      consumes:
      - application/json
      description: Validates a Jet template and returns detailed error information
        if invalid
      parameters:
      - description: Jet template to validate
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/api.JetTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JetTemplateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Validate a Jet template
      tags:
      - jet
schemes:
- http
- https
swagger: "2.0"
